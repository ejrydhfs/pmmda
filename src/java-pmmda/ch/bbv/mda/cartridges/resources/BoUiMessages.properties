bo-generate=Flag indicating if the package should be processed or not. Flag indicating if class without MDA stereotypes should be processed or not
bo-root=The variable defining the root directory where the Java artifacts are generated
bo-is-root=Flag indicating if the class is a root for the bog framework
bo-is-shallow=Flag indicating if the class support shallow mode or not
bo-is-hierarchical=Flag indicating if a reference code is hierarchical or not
bo-mode=Specifies if the property is read, write, or read-write
bo-change-event=Flag indicating if the property is changeable
bo-veto-event=Flag indicating if the property is vetoable
bo-navigable=Defines the property used to navigate to the owner
bo-lightweight=Flag indicating if the property is in the lightweight representation
bo-container-class=The qualified name of the container class used to store indexed properties
bo-interface-class=The qualified name of the interface class used to store indexed properties
bo-is-ordered=The container is ordered using a key class
bo-key-class=If the property is ordered, the tag defines the class of the key
 