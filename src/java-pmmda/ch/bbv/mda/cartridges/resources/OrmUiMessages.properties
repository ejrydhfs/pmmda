orm-schema=The name of the database schema
orm-table-name=The name of the table containing instances of the class
orm-column-name=Name of the column containing the property values
orm-column-type=JDBC type of the property
orm-column-size=Size of the JDBC type if relevant - e.g. strings -
orm-is-primary=Flag indicating if the property is part of the primary key
orm-can-be-null=Flag indicating if the property is optional and have null values
orm-locking=Flag indicating if the property is used for optimistic locking
orm-order-by=Flag indicating if result sets should be ordered with this property. The value can be null
