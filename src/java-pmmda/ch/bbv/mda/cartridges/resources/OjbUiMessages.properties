ojb-schema=The name of the database schema
ojb-table-name=The name of the table containing instances of the class
ojb-column-name=Name of the column containing the property values
ojb-column-type=JDBC type of the property
ojb-column-size=Size of the JDBC type if relevant - e.g. strings -
ojb-is-primary=Flag indicating if the property is part of the primary key
ojb-can-be-null=Flag indicating if the property is optional and have null values
ojb-locking=Flag indicating if the property is used for optimistic locking
ojb-order-by=Flag indicating if result sets should be ordered with this property. The value can be null
