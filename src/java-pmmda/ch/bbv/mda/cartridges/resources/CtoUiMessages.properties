cto-package-idl=Name of the IDL package
cto-bo2dto-package=The qualified name of the package containing the transformers from business objects to transfer objects are generated
cto-lw2dto-package=The qualified name of the package containing the transformer from lightweight objects to transfer objects are generated
cto-bo2to-class=The name of the translator class for business objects
cto-lw2to-class=The name of the translator class for lightweight objects
cto-mo-class=The name of the business object IDL structure, and the name of the file containing it
cto-lw-class=The name of the lightweight object IDL structure, and the name of the file containing it
cto-idl-type=The IDL type compatible with the UML model type