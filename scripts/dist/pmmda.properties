# configuration properties for the Velocity engine. The path defines the 
# location where the Velocity templates are stored. The library defines the
# location where the macros are defined.
file.resource.loader.path=./resources
file.resource.loader.cache=true
file.resource.loader.modificationCheckInterval=3600
velocimacro.library=mda-macros.vm
parser.pool.size=5

# pmMDA application -----------------------------------------------------------
# configuration properties for the application
pmmda.cartridges.01=ch.bbv.mda.cartridges.BoCartridge
pmmda.cartridges.02=ch.bbv.mda.cartridges.CtoCartridge
pmmda.cartridges.03=ch.bbv.mda.cartridges.EjbCartridge
pmmda.cartridges.04=ch.bbv.mda.cartridges.OexCartridge
pmmda.cartridges.05=ch.bbv.mda.cartridges.OrmCartridge

# application property defining if validation is performed before generating
pmmda.should-validate=true

# pmMDA project configuration -------------------------------------------------
# variables can freely be defined to provide a legible structure to the file.
project.dir=./work/example
project.gen.dir=${project.dir}/gendir

# BO Cartridge ----------------------------------------------------------------
# configuration properties fo the BO business object cartridge

# defines the target language of the data object cartridge.
bo-cartridge.language=java-1.5

# defines the location where reference code descriptions are stored.
bo-cartridge.reference-code-folder=${project.dir}/model

# defines the root folder for the Java files for the common, server and client.
bo-cartridge.common-source-root-folder=${project.dir}/test-java/common
bo-cartridge.server-source-root-folder=${project.dir}/test-java/server
bo-cartridge.client-source-root-folder=${project.dir}/test-java/client

#bo-cartridge.interface-package-postfix
#bo-cartridge.business-package-postfix
bo-cartridge.lightweight-package-postfix=.lw
bo-cartridge.should-generate-interface=false

# defines the prefix and postfix for the class names
#bo-cartridge.interface-object-class-prefix
bo-cartridge.interface-object-class-postfix=If
#bo-cartridge.business-object-class-prefix
#bo-cartridge.business-object-class-postfix
#bo-cartridge.lightweight-object-class-prefix
bo-cartridge.lightweight-object-class-postfix=Lw

#bo-cartridge.class-field-prefix
#bo-cartridge.class-field-postfix

# ORM Cartridge ---------------------------------------------------------------
# ORM template configurations for specific databases
orm-cartridge.ddl.MySQL=orm-ddl.vm
orm-cartridge.ddl.DB2=orm-ddlDB2.vm
orm-cartridge.ddl.HSQL=orm-ddl.vm
orm-cartridge.ddl.postresSQL=orm-ddl.vm

orm-cartridge.ddl-integrity.MySQL=orm-ddlIntegrity.vm
orm-cartridge.ddl-integrity.DB2=orm-ddlIntegrityDB2.vm
orm-cartridge.ddl-integrity.HSQL=orm-ddlIntegrity.vm
orm-cartridge.ddl-integrity.postresSQL=orm-ddlIntegrity.vm

# configuration properties for the ORM persistence cartridge
orm-cartridge.root-folder=${project.gen.dir}/orm-server

# generate the indexed for all foreign keys defined in the schema
orm-cartridge.generate-fk-index=true

# generate the constraints for all foreign keys defined in the schema
orm-cartridge.generate-constraints=false

# mechanism for the inheritance structures: extend, expand, join
orm-cartridge.inheritance=expand 

# defines in the specific DDL is generated using velocity or Jakarta ddlUtils
# legal values are ddlUtils, <none>. The ddlUtils subsystem needs an Internet
# connection to work
orm-cartridge.database-DDL-generator=ddlUtils

# legal values are MySQL, Derby, Torque, PostgresSQL, DB2, Oracle, SQLServer
# Firebird, HsqlDB, MaxDB, McKoi, Sybase, Axion
# some of these values are only supported if ddlUtils is activated
orm-cartridge.database=Derby

# defines the prefix and postfix for the table and column names.
#orm-cartridge.table-prefix
#orm-cartridge.table-postfix
#orm-cartridge.column-prefix
#orm-cartridge.column-postfix

# CTO Cartridge ---------------------------------------------------------------
# configuration properties for the CTO persistence cartridge
cto-cartridge.idl-root-folder=${project.gen.dir}/corba-idl
cto-cartridge.java-root-folder=${project.gen.dir}/corba-common
cto-cartridge.transform-package-postfix=.transform

# defines the prefix and postfix for the IDL structures.
#cto-cartridge.idl-prefix
cto-cartridge.idl-postfix=Cto

# OEX Cartridge ---------------------------------------------------------------
# configuration properties for the OEX persistence cartridge
oex-cartridge.rich-client-package-extension=.client
oex-cartridge.rich-client-folder=${project.gen.dir}/rich-client

# EJB Cartridge ---------------------------------------------------------------
# configuration properties for the EJB client/server cartridge
ejb-cartridge.server-package-extension=.server
ejb-cartridge.client-package-extension=.client
ejb-cartridge.server-class-postfix=Impl
ejb-cartridge.client-class-postfix=Wrapper
ejb-cartridge.generate-corba=true
ejb-cartridge.server-corba-root-folder=${project.gen.dir}/corba-server
ejb-cartridge.client-corba-root-folder=${project.gen.dir}/corba-client
ejb-cartridge.generate-bean=true

# defines the target J2EE server: jboss, geronimo
ejb-cartridge.j2ee-server=jboss

ejb-cartridge.server-j2ee-root-folder=${project.gen.dir}/j2ee-server
ejb-cartridge.common-j2ee-root-folder=${project.gen.dir}/j2ee-common
ejb-cartridge.client-j2ee-root-folder=${project.gen.dir}/j2ee-client
ejb-cartridge.server-locator-classname=ch.bbv.dnm.users.server.UserApplication
