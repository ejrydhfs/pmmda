## You should adapt the properties to reflect the location of the JDK,
## ant and of JBoss if you desire to deploy to J2EE

## example for Microsoft Windows XP
## java.jdk        	  = C:/Program Files/Java/jdk1.5.0_06
## java.tools      	  = C:/Program Files/Java/jdk1.5.0_06/bin
## ant.home        	  = c:/bin/ant
## jboss.home      	  = c:/sbin/jboss
## geronimo.home		  = C:/bin/geronimo-1.0

## example for OS X Tiger

java.jdk        	  = /System/Library/Frameworks/JavaVM.framework/Versions/CurrentJDK/
java.lib			      = /System/Library/Frameworks/JavaVM.framework/Versions/CurrentJDK/Libraries
java.tools      	  = /System/Library/Frameworks/JavaVM.framework/Versions/CurrentJDK/Commands/
ant.home        	  = /usr/bin/ant
forrest.home	   	  = /Users/Shared/bin/apache-forrest-0.7
jboss.home      	  = /Users/Shared/temp
geronimo.home		    = /Applications/geronimo-1.1